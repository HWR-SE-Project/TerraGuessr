name: terraguessr

# TerraGuessr local dev stack. Copy .env.example -> .env first.
#   docker compose up --build -d
# The frontend runs separately via `npm run dev --prefix frontend` at
# http://localhost:8080. postgres, backend and a Mailpit test SMTP inbox are
# defined here: verification emails land at http://localhost:8025. Point
# SMTP_URL at a real provider in .env to deliver real mail.
# All local URLs use localhost; the Vite dev server reads BACKEND_HOST_PORT
# from .env and proxies /api to http://localhost:<BACKEND_HOST_PORT>.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terraguessr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terraguessr}
      POSTGRES_DB: ${POSTGRES_DB:-terraguessr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terraguessr} -d ${POSTGRES_DB:-terraguessr}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Test SMTP sink + web inbox for email verification / password reset.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/server.js"]
    restart: unless-stopped
    environment:
      # Values interpolate from .env (copy .env.example -> .env; architecture.md
      # §10 / R19). Defaults keep `docker compose config` valid before .env
      # exists. DATABASE_URL points at the compose-network postgres service; the
      # .env value is only used when running the backend outside of compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-terraguessr}:${POSTGRES_PASSWORD:-terraguessr}@postgres:5432/${POSTGRES_DB:-terraguessr}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MET_NO_BASE_URL: ${MET_NO_BASE_URL:-https://api.met.no}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Empty/omitted values fall back to the mailpit service.
      SMTP_URL: "${SMTP_URL:-smtp://mailpit:1025}"
      SMTP_FROM: "${SMTP_FROM:-TerraGuessr <no-reply@terraguessr.local>}"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
