name: terraguessr-prod

# =============================================================================
# TerraGuessr — production stack (R17 / task O-02)
# =============================================================================
# Differences from the local docker-compose.yml:
#   * Only Caddy publishes ports (80/443). Postgres and the app services are
#     reachable only on the compose network.
#   * No bind mounts of source trees — images are built from the Dockerfiles.
#   * Secrets and hostnames come from .env (gitignored) via environment
#     variable interpolation;
#     compose fails fast when a required production value is missing.
#   * restart: unless-stopped on every service.
#
# Usage (see docs/deploy.md for the full procedure):
#   cp .env.example .env        # then fill in the production values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required in .env: POSTGRES_PASSWORD, ADMIN_API_TOKEN, DOMAIN, ACME_EMAIL.
# NEVER commit .env. Do not purchase a domain or publish this stack without
# Product Owner approval (decision B.7).
#
# The frontend SPA is built into a static nginx image (frontend/Dockerfile) and
# served through Caddy; /api/* is proxied to backend.
#
# mailpit is a local SMTP capture box for TESTING the email-verification flow.
# Its web UI binds to 127.0.0.1 only: reach it with an SSH tunnel
#   ssh -L 8025:127.0.0.1:8025 user@host  →  http://localhost:8025
# Set SMTP_URL + SMTP_FROM in .env to a real provider to deliver real mail;
# no code or compose changes are needed.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terraguessr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-terraguessr}
    volumes:
      # Named volume only: no host bind mounts in production.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terraguessr} -d ${POSTGRES_DB:-terraguessr}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # Test SMTP sink + web inbox. Safe defaults keep verification working with no
  # .env edits; override SMTP_URL/SMTP_FROM in .env for real delivery.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
    # UI is host-local only; SMTP stays on the compose network.
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Host "postgres" is the compose service name; the URL in .env is only
      # used when running the backend outside of compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-terraguessr}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}@postgres:5432/${POSTGRES_DB:-terraguessr}
      PORT: "${PORT:-3000}"
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN is required — set it in .env}
      # Caddy is the only hop in front of the API; trust exactly that one so
      # rate limits use the real client IP without trusting spoofable XFF values.
      TRUST_PROXY: "1"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required — set it in .env}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://${DOMAIN}}
      # Empty/omitted values fall back to the mailpit service. Set both to a
      # real provider URL/sender in .env to send real verification email.
      SMTP_URL: "${SMTP_URL:-smtp://mailpit:1025}"
      SMTP_FROM: "${SMTP_FROM:-TerraGuessr <no-reply@terraguessr.local>}"
      SESSION_COOKIE_SECURE: "true"
    # No published ports: Caddy proxies /api to this service over the network.
    expose:
      - "${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # Static SPA build. VITE_* values are inlined at build time, so changing one
  # requires rebuilding: docker compose -f docker-compose.prod.yml up -d --build frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

  # TLS termination + reverse proxy. Caddy obtains and renews Let's Encrypt
  # certificates automatically for ${DOMAIN} (see Caddyfile).
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required — set it in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required — set it in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates + ACME account (must persist)
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
