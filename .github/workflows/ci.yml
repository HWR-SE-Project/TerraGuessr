name: CI

on:
  pull_request:
    branches: [main, integration/phase1]
  push:
    branches: [main, integration/phase1]

jobs:
  changes:
    name: Detect changed targets
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      e2e: ${{ steps.detect.outputs.e2e }}
      deploy_backend: ${{ steps.detect.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.detect.outputs.deploy_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: Classify changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_backend=false
          run_frontend=false
          run_e2e=false
          deploy_backend=false
          deploy_frontend=false

          diff_ok=false
          changed_files=()

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
              if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
                git fetch --no-tags --filter=blob:none origin "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || true
              fi
              if git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
                while IFS= read -r file; do
                  changed_files+=("$file")
                done < <(git -c core.quotepath=false diff --name-only --no-renames "$PR_BASE_SHA...$PR_HEAD_SHA")
                diff_ok=true
              fi
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                git fetch --no-tags --filter=blob:none origin "$BEFORE_SHA" 2>/dev/null || true
              fi
              if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${AFTER_SHA}^{commit}" 2>/dev/null; then
                while IFS= read -r file; do
                  changed_files+=("$file")
                done < <(git -c core.quotepath=false diff --name-only --no-renames "$BEFORE_SHA" "$AFTER_SHA")
                diff_ok=true
              fi
            fi
          fi

          if [ "$diff_ok" != "true" ]; then
            echo "Base commit unavailable (initial push, history rewrite, or unsupported event) — enabling all checks and deploy targets."
            run_backend=true
            run_frontend=true
            run_e2e=true
            deploy_backend=true
            deploy_frontend=true
          else
            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "No changed files detected."
            fi

            for file in ${changed_files[@]+"${changed_files[@]}"}; do
              [ -z "$file" ] && continue
              case "$file" in
                *.md|docs/*|scripts/*|LICENSE|.gitignore|.dockerignore|.env.example|docker-compose.yml|docker-compose.prod.yml|Caddyfile)
                  echo "Ignoring non-CI/non-deploy file: $file"
                  ;;
                .github/*)
                  echo "CI workflow/config changed ($file) — running all checks (no deploy)."
                  run_backend=true
                  run_frontend=true
                  run_e2e=true
                  ;;
                render.yaml)
                  echo "Render config changed ($file) — enabling backend deploy."
                  deploy_backend=true
                  ;;
                frontend/vercel.json)
                  echo "Vercel config changed ($file) — enabling frontend deploy."
                  deploy_frontend=true
                  ;;
                backend/test/fake-open-meteo/*)
                  echo "E2E weather mock changed ($file) — running backend checks and e2e (no deploy)."
                  run_backend=true
                  run_e2e=true
                  ;;
                backend/test/*)
                  echo "Backend test file changed ($file) — running backend checks only."
                  run_backend=true
                  ;;
                backend/*)
                  echo "Backend runtime/config changed ($file) — running backend + e2e and enabling backend deploy."
                  run_backend=true
                  run_e2e=true
                  deploy_backend=true
                  ;;
                frontend/src/test/*|frontend/src/*.test.ts|frontend/src/*.test.tsx|frontend/src/*.spec.ts|frontend/src/*.spec.tsx)
                  echo "Frontend test file changed ($file) — running frontend checks only."
                  run_frontend=true
                  ;;
                frontend/*)
                  echo "Frontend runtime/config changed ($file) — running frontend + e2e and enabling frontend deploy."
                  run_frontend=true
                  run_e2e=true
                  deploy_frontend=true
                  ;;
                e2e/*|playwright.config.ts|docker-compose.test.yml|package.json|package-lock.json)
                  echo "E2E suite/config changed ($file) — running e2e only."
                  run_e2e=true
                  ;;
                *)
                  echo "Shared/unclassified file changed ($file) — enabling all checks and deploy targets."
                  run_backend=true
                  run_frontend=true
                  run_e2e=true
                  deploy_backend=true
                  deploy_frontend=true
                  ;;
              esac
            done
          fi

          {
            echo "backend=$run_backend"
            echo "frontend=$run_frontend"
            echo "e2e=$run_e2e"
            echo "deploy_backend=$deploy_backend"
            echo "deploy_frontend=$deploy_frontend"
          } >> "$GITHUB_OUTPUT"

          echo "Targets: backend=$run_backend, frontend=$run_frontend, e2e=$run_e2e, deploy_backend=$deploy_backend, deploy_frontend=$deploy_frontend"

          {
            echo "### Changed targets"
            echo ""
            echo "| Job / Target | Run |"
            echo "| --- | --- |"
            echo "| Backend checks | \`$run_backend\` |"
            echo "| Frontend checks | \`$run_frontend\` |"
            echo "| E2E (Playwright) | \`$run_e2e\` |"
            echo "| Deploy backend (Render) | \`$deploy_backend\` |"
            echo "| Deploy frontend (Vercel) | \`$deploy_frontend\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend (lint + Vitest)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: terraguessr
          POSTGRES_PASSWORD: terraguessr
          POSTGRES_DB: terraguessr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terraguessr -d terraguessr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://terraguessr:terraguessr@localhost:5432/terraguessr
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: echo "exists=$( [ -f backend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci
      - name: Wait for Postgres
        if: steps.check.outputs.exists == 'true'
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then
              echo "Postgres is accepting connections."
              exit 0
            fi
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          echo "Postgres did not become ready in time."
          exit 1
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present
      - name: Typecheck and production build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck && npm run build
      - name: Test (Vitest)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present
      - name: Test (Vitest integration)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run test:integration --if-present
      - name: Skip (backend not scaffolded yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/ does not exist yet — Phase 1 has not started. Nothing to check."

  frontend:
    name: Frontend (lint + Vitest)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: echo "exists=$( [ -f frontend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Typecheck and production build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck && npm run build
      - name: Test (Vitest)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present
      - name: Skip (frontend not scaffolded yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "frontend/ does not exist yet — Phase 1 has not started. Nothing to check."

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.e2e == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Check e2e suite exists
        id: check
        run: |
          if [ -d e2e ] && [ -n "$(find e2e -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.test.ts' -o -name '*.test.tsx' \) | head -n 1)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Playwright
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: Install Playwright browsers
        if: steps.check.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start stack (Docker Compose)
        if: steps.check.outputs.exists == 'true'
        run: docker compose -f docker-compose.test.yml up -d --build
      - name: Wait for stack health
        if: steps.check.outputs.exists == 'true'
        run: |
          for i in $(seq 1 90); do
            if curl -fsS "http://localhost:8080/api/health" >/dev/null 2>&1; then
              echo "Stack is healthy."
              exit 0
            fi
            echo "Waiting for stack health ($i/90)..."
            sleep 2
          done
          echo "Stack did not become healthy in time. Diagnostics:"
          docker compose -f docker-compose.test.yml ps || true
          docker compose -f docker-compose.test.yml logs --no-color || true
          exit 1
      - name: Run Playwright
        if: steps.check.outputs.exists == 'true'
        run: npx playwright test
      - name: Stop stack
        if: always() && steps.check.outputs.exists == 'true'
        run: docker compose -f docker-compose.test.yml down --remove-orphans --volumes || true
      - name: Skip (no e2e suite yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No e2e specs under e2e/ yet — Phase 1 has not started. Nothing to run."

  deploy:
    name: Deploy (Render + Vercel)
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend, e2e]
    if: |
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    steps:
      - name: Validate deploy hook secrets
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.deploy_frontend }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          if [ "$DEPLOY_BACKEND" = "true" ] && [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing required GitHub Actions secret: RENDER_DEPLOY_HOOK_URL"
            missing=1
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing required GitHub Actions secret: VERCEL_DEPLOY_HOOK_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing deploy hook URL secret(s) under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Trigger Render deploy (backend)
        if: needs.changes.outputs.deploy_backend == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render backend deployment..."
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo ""

      - name: Trigger Vercel deploy (frontend)
        if: needs.changes.outputs.deploy_frontend == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel frontend deployment..."
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo ""
