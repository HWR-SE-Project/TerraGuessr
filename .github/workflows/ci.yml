name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: echo "exists=$( [ -f backend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present
      - name: Test (Vitest)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present
      - name: Skip (backend not scaffolded yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/ does not exist yet — Phase 1 has not started. Nothing to check."

  frontend:
    name: Frontend (lint + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: echo "exists=$( [ -f frontend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Test (Vitest)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present
      - name: Skip (frontend not scaffolded yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "frontend/ does not exist yet — Phase 1 has not started. Nothing to check."

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Check e2e suite exists
        id: check
        run: echo "exists=$( [ -f playwright.config.ts ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.check.outputs.exists == 'true'
        run: npx playwright install --with-deps
      - name: Run Playwright
        if: steps.check.outputs.exists == 'true'
        run: npx playwright test
      - name: Skip (no e2e suite yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No Playwright config yet — Phase 1 has not started. Nothing to run."
